<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Premium</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header / HUD -->
        <header class="hud">
            <div class="hud-item difficulty-select">
                <button id="btn-difficulty" class="hud-btn" aria-label="Change Difficulty">
                    <span id="current-difficulty">Medium</span>
                    <span class="icon-chevron">▼</span>
                </button>
                <div class="difficulty-menu hidden" id="difficulty-menu">
                    <button data-diff="easy">Easy</button>
                    <button data-diff="medium">Medium</button>
                    <button data-diff="hard">Hard</button>
                    <button data-diff="custom">Custom</button>
                </div>
            </div>

            <div class="hud-item counter-container">
                <div class="icon-mine">💣</div>
                <div class="counter-text" id="mine-count">040</div>
            </div>

            <div class="hud-item reset-container">
                <button id="btn-restart" class="emoji-btn" aria-label="Restart Game">🙂</button>
            </div>

            <div class="hud-item theme-container">
                <button id="btn-theme" class="hud-btn" aria-label="Toggle Theme">🌗</button>
            </div>

            <div class="hud-item counter-container">
                <div class="icon-timer">⏱️</div>
                <div class="counter-text" id="timer">000</div>
            </div>

            <div class="hud-item score-container">
                <div class="score-label">SCORE</div>
                <div class="score-text" id="score">0</div>
            </div>
        </header>

        <!-- Game Board -->
        <main class="game-board-container">
            <div id="game-board" class="game-board">
                <!-- Tiles generated by JS -->
            </div>
        </main>

        <!-- Modals / Overlays -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <!-- End Game Modal -->
            <div id="end-game-modal" class="modal hidden">
                <h2 id="end-game-title">Victory!</h2>
                <div class="score-breakdown">
                    <div class="score-row"><span>Base Score:</span> <span id="score-base">0</span></div>
                    <div class="score-row"><span>Time Bonus:</span> <span id="score-time">0</span></div>
                    <div class="score-row"><span>Difficulty Bonus:</span> <span id="score-difficulty">0</span></div>
                    <div class="score-row penalty"><span>Penalties:</span> <span id="score-penalty">0</span></div>
                    <div class="score-row total"><span>Total Score:</span> <span id="score-total">0</span></div>
                </div>
                <div class="high-score-notify hidden" id="new-best">🎉 NEW BEST! 🎉</div>
                <div class="modal-actions">
                    <button id="btn-play-again" class="primary-btn">Play Again</button>
                    <button id="btn-menu" class="secondary-btn">Menu</button>
                </div>
            </div>

            <!-- Custom Difficulty Modal -->
            <div id="custom-game-modal" class="modal hidden">
                <h2>Custom Game</h2>
                <div class="custom-inputs">
                    <div class="input-group">
                        <label for="custom-rows">Rows</label>
                        <input type="number" id="custom-rows" min="5" max="50" value="16">
                    </div>
                    <div class="input-group">
                        <label for="custom-cols">Cols</label>
                        <input type="number" id="custom-cols" min="5" max="50" value="30">
                    </div>
                    <div class="input-group">
                        <label for="custom-mines">Mines</label>
                        <input type="number" id="custom-mines" min="1" max="999" value="99">
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="btn-start-custom" class="primary-btn">Start</button>
                    <button id="btn-cancel-custom" class="secondary-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
